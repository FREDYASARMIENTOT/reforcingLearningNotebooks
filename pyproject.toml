[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-project"
version = "1.0.0"
description = "Taller 1 — Dynamic Programming on MilanTaxi"
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=1.2",
    "numpy>=2.4",
    "tqdm>=4.67",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]